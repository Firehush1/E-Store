<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo-removebg-preview.png">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    

</head>

<body>

   <div class="container login-container d-flex align-items-center">
    <div class="row login-box w-100">

        <div class="col-md-6 p-0">
            <img src="img/logo-removebg-preview.png" class="login-image">
            
        </div>

        <div class="col-md-6 form-section">
            <h2 class="text-center text-danger-emphasis">Welcome Back</h2>
            <p class="text-center mb-4">Please login your Account</p>
            

            <!-- form section -->

            <form>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="email"/ >
                </div>

                <div class="mb-2">
                    <label class="form-label">password</label>
                    <input type="password" class="form-control" placeholder="password"/>
                </div>

                <button type="submit" class="btn btn-warning login-btn"Login </button>
            </form>
        </div>
        
    </div>
   </div> 


</body>
</html>
